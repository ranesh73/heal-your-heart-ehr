services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ehr
      POSTGRES_DB: ehr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_env.py first}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ehr -d ehr"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://ehr:${POSTGRES_PASSWORD}@db:5432/ehr
      EHR_DATA_DIR: /data
      EHR_SECURE_COOKIES: "0"
      EHR_ORIGINS: http://127.0.0.1:8000,http://localhost:8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - document_data:/data
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: .
    command: ["sh", "-c", "until python -c 'from sqlalchemy import text; from app.db import engine; engine.connect().execute(text(\"SELECT 1 FROM jobs LIMIT 1\"))'; do sleep 2; done; python -m app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://ehr:${POSTGRES_PASSWORD}@db:5432/ehr
      EHR_DATA_DIR: /data
    volumes:
      - document_data:/data
    depends_on:
      - app
volumes:
  postgres_data:
  document_data:
